name: PlainWeek
options:
    bundleIdPrefix: app.plainweek
    deploymentTarget:
        macOS: '14.0'
    createIntermediateGroups: true
settings:
    base:
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.3.15'
        CURRENT_PROJECT_VERSION: '1'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
targets:
    PlainWeek:
        type: application
        platform: macOS
        sources:
            - path: PlainWeek
        entitlements:
            path: PlainWeek/PlainWeek.entitlements
            properties:
                com.apple.security.app-sandbox: true
                com.apple.security.files.user-selected.read-write: true
                com.apple.security.files.bookmarks.app-scope: true
                com.apple.security.personal-information.calendars: true
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: app.plainweek.mac
                PRODUCT_NAME: Plain Week
                GENERATE_INFOPLIST_FILE: YES
                INFOPLIST_KEY_CFBundleDisplayName: Plain Week
                INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
                INFOPLIST_KEY_NSHumanReadableCopyright: 'MIT License'
                ENABLE_APP_SANDBOX: YES
                ENABLE_USER_SELECTED_FILES: readwrite
                ENABLE_RESOURCE_ACCESS_CALENDARS: YES
                INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Plain Week shows your calendar events in each day and, if you turn it on, puts tasks with a time in a Plain Week calendar."
                INFOPLIST_KEY_NSCalendarsUsageDescription: "Plain Week shows your calendar events in each day and, if you turn it on, puts tasks with a time in a Plain Week calendar."
                INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Plain Week keeps a Plain Week list in Reminders in step with your tasks, so they reach your iPhone and Apple Watch."
                INFOPLIST_KEY_NSRemindersUsageDescription: "Plain Week keeps a Plain Week list in Reminders in step with your tasks, so they reach your iPhone and Apple Watch."
                INFOPLIST_KEY_LSUIElement: NO
                ENABLE_HARDENED_RUNTIME: YES
                CODE_SIGN_STYLE: Automatic
                CODE_SIGN_IDENTITY: '-'
                COMBINE_HIDPI_IMAGES: YES
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PlainWeekTests:
        type: bundle.unit-test
        platform: macOS
        sources:
            - path: PlainWeekTests
        dependencies:
            - target: PlainWeek
        settings:
            base:
                GENERATE_INFOPLIST_FILE: YES
                PRODUCT_BUNDLE_IDENTIFIER: app.plainweek.mac.tests
                TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Plain Week.app/Contents/MacOS/Plain Week'
                BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
    PlainWeek:
        build:
            targets:
                PlainWeek: all
                PlainWeekTests: [test]
        test:
            targets:
                - PlainWeekTests
