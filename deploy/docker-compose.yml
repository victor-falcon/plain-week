# Plain Week on any Docker host. See docs/self-hosting.md.
#
#   1. Put a random key in .env next to this file (keep it; it encrypts sessions):
#        echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
#        echo "APP_URL=https://plan.example.com" >> .env
#   2. docker compose up -d
#
# The app listens on port 8080 over plain HTTP: put a reverse proxy that
# terminates TLS in front of it (service workers need HTTPS).

services:
    plainweek:
        image: ghcr.io/victor-falcon/plain-week:latest
        restart: unless-stopped
        ports:
            - '127.0.0.1:8080:8080'
        volumes:
            - plainweek-storage:/app/storage
        environment:
            APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see the comment at the top of docker-compose.yml)}
            APP_URL: ${APP_URL:-http://localhost:8080}
            APP_NOINDEX: ${APP_NOINDEX:-false}
            SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
            MAIL_MAILER: ${MAIL_MAILER:-log}

volumes:
    plainweek-storage:
